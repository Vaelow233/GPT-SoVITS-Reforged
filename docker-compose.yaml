x-common: &common
  platform: linux/amd64
  init: true
  ports:
    - "9871:9871"
    - "9872:9872"
    - "9873:9873"
    - "9874:9874"
    - "9880:9880"
  volumes:
    - .:/workspace/GPT-SoVITS
    - model-cache:/root/.cache
  environment:
    MODEL_SOURCE: ${MODEL_SOURCE:-ModelScope}
    DOWNLOAD_MODELS: ${DOWNLOAD_MODELS:-true}
    DOWNLOAD_UVR5: ${DOWNLOAD_UVR5:-false}
    WEBUI_LANGUAGE: ${WEBUI_LANGUAGE:-zh_CN}
    is_half: ${IS_HALF:-true}
  shm_size: ${SHM_SIZE:-16g}
  restart: unless-stopped

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

services:
  cu128:
    <<: *common
    profiles: [cu128]
    image: gpt-sovits-reforged:local-cu128
    build:
      context: .
      args:
        DEVICE: cu128
    deploy: *gpu
  cu126:
    <<: *common
    profiles: [cu126]
    image: gpt-sovits-reforged:local-cu126
    build:
      context: .
      args:
        DEVICE: cu126
    deploy: *gpu
  cpu:
    <<: *common
    profiles: [cpu]
    image: gpt-sovits-reforged:local-cpu
    build:
      context: .
      args:
        DEVICE: cpu

volumes:
  model-cache:
