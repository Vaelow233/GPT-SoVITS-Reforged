[project]
name = "gpt-sovits"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "av>=11",
    "chardet",
    "cn2an",
    "ctranslate2>=4.0,<5",
    "fast-langdetect>=0.3.1",
    "fastapi[standard]==0.115.6",
    "faster-whisper==1.2.1",
    "ffmpeg-python",
    "funasr>=1.3.7",
    "g2p-en",
    "g2pk2",
    "gradio<5",
    "jieba",
    "jieba-fast",
    "ko-pron",
    "librosa==0.10.2",
    "modelscope",
    "numba",
    "numpy<2.0",
    "opencc",
    "peft<0.18.0",
    "psutil",
    "pydantic<=2.10.6",
    "pyopenjtalk>=0.4.1",
    "pypinyin",
    "python-mecab-ko ; sys_platform != 'win32'",
    "pytorch-lightning>=2.4",
    "pyyaml",
    "rotary-embedding-torch",
    "scipy",
    "sentencepiece",
    "split-lang",
    "starlette==0.41.3",
    "tensorboard",
    "tojyutping",
    "torchcodec==0.16.0",
    "torchmetrics<=1.5",
    "tqdm",
    "transformers>=4.51,<5",
    "wordsegment",
    "x-transformers",
]

[project.optional-dependencies]
cpu = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "onnxruntime>=1.21,<1.27",
]
cu126 = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "onnxruntime-gpu>=1.21,<1.27",
]
cu128 = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "onnxruntime-gpu>=1.21,<1.27",
]

[tool.uv]
package = false
no-binary-package = ["opencc"]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
        { extra = "cu128" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchcodec = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.dependency-metadata]]
name = "faster-whisper"
version = "1.2.1"
requires-python = ">=3.9"
requires-dist = [
    "ctranslate2>=4.0,<5",
    "huggingface-hub>=0.21",
    "tokenizers>=0.13,<1",
    "av>=11",
    "tqdm",
]